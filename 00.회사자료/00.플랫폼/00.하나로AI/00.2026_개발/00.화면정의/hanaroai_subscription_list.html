<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/layout}">


<!-- CSS 작성 -->
<th:block layout:fragment="app-content-css">

    <style>
        /* 손글씨 강조 문구 */
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap');
        .hand { font-family: 'Nanum Pen Script', cursive; }
    </style>

</th:block>

<!-- HTML 작성 -->
<th:block th:fragment="content">

    <main class="min-h-screen bg-white pb-24">

        <!-- ================================================================= -->
        <!-- 1. Header (너비 100% 꽉 채움)                                        -->
        <!--    ※ layout 쪽에 container/padding이 있어 헤더가 좌우 끝까지 닿지 않으면,        -->
        <!--      section 클래스에 "w-screen relative left-1/2 -translate-x-1/2" 를 추가하세요. -->
        <!-- ================================================================= -->
        <section class="relative w-full overflow-hidden bg-gradient-to-br from-[#EEF3FF] via-[#F5F8FF] to-[#FFF6EE] border-b border-slate-100">
            <div class="absolute -top-24 -right-24 w-96 h-96 bg-indigo-200/40 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-32 left-1/3 w-96 h-96 bg-orange-200/30 rounded-full blur-3xl pointer-events-none"></div>

            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-10 sm:pt-14 pb-10 lg:pb-0 relative z-10">
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-6 items-center">

                    <!-- LEFT : 제목 / 설명 -->
                    <div class="lg:col-span-5 space-y-4 lg:pb-14">
                        <span class="inline-flex px-4 py-1.5 rounded-full bg-white/80 border border-blue-100 text-sm font-bold text-blue-600">Hanaro AI Plan</span>
                        <h1 class="text-4xl sm:text-5xl font-black tracking-tight leading-[1.2] text-slate-950"
                            th:utext="${menu?.menu?.menu_nm} ?: '구독 <span class=&quot;text-blue-600&quot;>상품</span>'">
                            구독 <span class="text-blue-600">상품</span>
                        </h1>
                        <p class="text-base text-slate-600 leading-relaxed"
                            th:text="${menu?.menu?.menu_desc} ?: '필요한 기능과 사용 기간을 직접 골라 구독하세요. 사업 규모에 맞게 시작하고, 성장에 맞춰 늘려가세요.'">
                            필요한 기능과 사용 기간을 직접 골라 구독하세요. 사업 규모에 맞게 시작하고, 성장에 맞춰 늘려가세요.
                        </p>
                    </div>

                    <th:block th:each="ctgr,index: ${itm?.ctgr_lst}">
                        <button th:id="${ctgr['ctgr_id']}" type="button"
                            class="filter-btn px-5 py-2.5 rounded-full text-sm font-semibold transition-all bg-slate-100 text-slate-600 hover:bg-slate-200 [&.active]:bg-[#4F46E5] [&.active]:text-white [&.active]:font-bold [&.active]:shadow-md [&.active]:shadow-indigo-600/25"

                    </th:block>
                </div>

                    <a href="#" class="font-bold text-blue-600 hover:text-blue-700">상담 신청하기 →</a>
                </div>
            </div>

            <!-- 구독 안내 -->
            <div class="mb-6 flex items-start gap-3 px-5 py-4 rounded-2xl bg-[#F4F7FF] border border-blue-100 text-sm text-slate-600">
                <span class="mt-0.5 w-5 h-5 shrink-0 rounded-full bg-blue-600 text-white text-xs font-black flex items-center justify-center">i</span>
                <p>상품마다 <b class="text-slate-800">사용 기간 옵션</b>을 선택하면 결제 금액이 바로 계산됩니다. 선택한 옵션은 구매 화면으로 그대로 전달됩니다.</p>
            </div>

            <!-- ============================================================= -->
            <!-- 3. Subscription List (knockout foreach: prdt_lst 유지)          -->
            <!-- ============================================================= -->
            <div id="posts-list" data-bind="foreach : prdt_lst" class="space-y-4">

                <article
                    class="sub-row group bg-white rounded-3xl border border-slate-200 hover:border-blue-300 hover:shadow-xl hover:shadow-blue-900/5 transition-all p-4 sm:p-5"

                    <div class="grid grid-cols-1 md:grid-cols-12 gap-5 items-center">

                        <!-- 썸네일 + 상품 정보 (원본 링크 바인딩 유지) -->
                        <a th:attr="data-base-url=@{/site/{dscd_as}/{menu_id}(dscd_as=${dscd?.dscd_as_enc}, menu_id=${menu?.menu?.menu_id})}"
                            data-bind="attr: { href: $element.dataset.baseUrl + '?itm_id=' + itm_id + '&prdt_id=' + prdt_id + '&mode=viw' }"

                                    data-bind="text :ctgr_nm">구독 멤버십</span>
                            </div>
                            <div class="min-w-0 flex flex-col justify-center space-y-2">
                                <h3 class="text-lg font-extrabold text-slate-950 group-hover:text-blue-600 transition-colors"
                                    data-bind="text :prdt_tit">하나로AI 콘텐츠 엔진 구독</h3>
                                <p class="text-sm text-slate-500 line-clamp-2 leading-relaxed"
                                    data-bind="text :prdt_ctts">고객 질문 분석부터 검증 콘텐츠 생성, 발행까지 필요한 기능을 구독으로 이용합니다.</p>
                                <div class="flex items-center gap-3 text-xs text-slate-400 pt-1">
                                    <span>판매자 <span class="text-slate-600 font-semibold" data-bind="text :wrt_usr_nm">하나로AI</span></span>
                                    <span class="w-px h-3 bg-slate-200"></span>
                                    <span data-bind="dateText :wrt_at">2026.08.13</span>
                                </div>
                            </div>
                        </a>

                        <!-- 옵션 선택 + 금액 + 구매 -->
                        <div class="md:col-span-4 md:pl-5 md:border-l border-slate-100 space-y-3">
                            <div>
                                <label class="block text-[11px] font-bold text-slate-400 mb-1.5">사용 기간 옵션</label>
                                <div class="relative">
                                    <select class="sub-option w-full appearance-none pl-4 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 focus:outline-none cursor-pointer transition-all"></select>
                                    <svg class="w-4 h-4 text-slate-500 absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                                </div>
                            </div>

                            <div class="flex items-end justify-between">
                                <span class="text-xs font-semibold text-slate-400">결제 금액</span>
                                <p class="text-2xl font-black text-slate-950"><span class="sub-price">가격 문의</span><span class="sub-won text-sm font-bold ml-0.5 hidden">원</span></p>
                            </div>

                            <a href="#" class="sub-buy block text-center py-3 text-sm font-bold text-white bg-[#4F46E5] hover:bg-[#4338CA] rounded-xl shadow-md shadow-indigo-600/25 hover:-translate-y-0.5 transition-all"
                                data-bind="attr: { href: $element.closest('.sub-row').querySelector('.sub-link').href }">구독하기</a>
                        </div>

                    </div>
                </article>

            </div>

        </div>
    </main>


</th:block>

<!-- JAVA SCRIPT 작성 -->
<th:block layout:fragment="app-content-js">


    <script type="text/javascript">

        dscd_handler.dscd_url_get = encodeURIComponent("[[${dscd?.dscd_url_dev}]]");
        dscd_handler.dscd_url_pst = "[[${dscd?.dscd_url_dev}]]";
        dscd_handler.dscd_as = "[[${dscd?.dscd_as_enc}]]";

        cmnt_handler.menu_id = "[[${menu?.menu?.menu_id}]]";
        cmnt_handler.cmnt_id = "[[${menu?.menu?.menu_type_cmnt_id}]]";
        cmnt_handler.dscd_url = dscd_handler.dscd_url_get;
        cmnt_handler.dscd_as = dscd_handler.dscd_as;
        cmnt_handler.ctts_id = "[[${cmnt?.ctts?.ctts_id}]]";
        cmnt_handler.ctgr_id = "[[${cmnt?.ctts?.ctgr_id}]]";
        cmnt_handler.ctgr_id_org = "";

        itm_handler.menu_id = "[[${menu?.menu?.menu_id}]]";
        itm_handler.itm_id = "[[${menu?.menu?.menu_type_itm_id}]]";
        itm_handler.dscd_url = dscd_handler.dscd_url_get;
        itm_handler.dscd_as = dscd_handler.dscd_as;
        itm_handler.prdt_id = "[[${itm?.prdt?.prdt_id}]]";
        itm_handler.ctgr_id = "[[${itm?.prdt?.ctgr_id}]]";
        itm_handler.ctgr_id_org = "[[${itm?.prdt?.ctgr_id}]]";
        itm_handler.prdt_href_url = "[[${itm?.prdt?.prdt_href_url}]]";

        function ViewModel() {
            this.ctts_lst = ko.observableArray([]);
            this.ctts_cmmt_lst = ko.observableArray([]);

            this.prdt_lst = ko.observableArray([]);
            this.prdt_cmmt_lst = ko.observableArray([]);
        };

        $(document).ready(function () {

            vm = new ViewModel();
            ko.applyBindings(vm);

            vm.ctts_lst([]);
            vm.ctts_cmmt_lst([]);

            vm.prdt_lst([]);
            vm.prdt_cmmt_lst([]);

            handler.fnInit();
            handler.fnGetLst();

            $(window).on('scroll', function () {

                // 문서 전체 높이
                const contentHeight = $(document).height();

                // 현재 브라우저 viewport 높이
                const viewportHeight = $(window).height();

                // 현재 스크롤 위치
                const scrollTop = $(window).scrollTop();

                // 바닥 근처 도달
                if (scrollTop + viewportHeight >= contentHeight - 300) {

                    if (isGetLst) {
                        handler.fnGetLst();
                    }
                }
            });

        });

        /* ------------------------------------------------------------------
         * 구독 옵션(사용 기간) 선택 → 결제 금액 계산 → 구매 링크에 옵션 전달
         *  - 기존 handler/knockout 로직은 건드리지 않는 화면 전용 스크립트
         *  - 월 단가는 상품 데이터의 prdt_price 필드(없으면 "가격 문의")
         *  - OPTIONS 의 rate(할인율)는 실제 요금 정책이 정해지면 수정하세요. (현재 0)
         * ------------------------------------------------------------------ */
        const OPTIONS = [
            { label: '1개월',  months: 1,  rate: 0 },
            { label: '3개월',  months: 3,  rate: 0 },
            { label: '6개월',  months: 6,  rate: 0 },
            { label: '12개월', months: 12, rate: 0 }
        ];

        function fmtWon(n) { return Math.round(n).toLocaleString('ko-KR'); }

        function initRow(row) {
            if (row.dataset.subInit === '1') return;
            const sel = row.querySelector('.sub-option');
            if (!sel) return;
            sel.innerHTML = OPTIONS.map((o, i) => `<option value="${i}">${o.label}${o.rate ? ' (' + Math.round(o.rate * 100) + '% 할인)' : ''}</option>`).join('');
            row.dataset.subInit = '1';
            updateRow(row);
        }

        function updateRow(row) {
            const base = Number(row.dataset.price) || 0;
            const opt = OPTIONS[Number(row.querySelector('.sub-option').value)] || OPTIONS[0];
            const priceEl = row.querySelector('.sub-price');
            const wonEl = row.querySelector('.sub-won');
            const buy = row.querySelector('.sub-buy');
            const link = row.querySelector('.sub-link');

            if (base > 0) {
                priceEl.textContent = fmtWon(base * opt.months * (1 - opt.rate));
                wonEl.classList.remove('hidden');
            } else {
                priceEl.textContent = '가격 문의';
                wonEl.classList.add('hidden');
            }
            // 구매 링크 : 상세(구매) 화면으로 선택 옵션 전달
            if (link && link.href) {
                const url = new URL(link.href, location.origin);
                url.searchParams.set('opt_months', opt.months);
                buy.href = url.toString();
            }
        }

        // knockout foreach 가 행을 그릴 때마다 초기화
        new MutationObserver(() => {
            document.querySelectorAll('#posts-list .sub-row').forEach(initRow);
        }).observe(document.getElementById('posts-list'), { childList: true });

        document.getElementById('posts-list').addEventListener('change', e => {
            if (e.target.classList.contains('sub-option')) updateRow(e.target.closest('.sub-row'));
        });

        // 카테고리 필터 active 표시 (원본 handler.fnGetLst 와 별개로 시각 상태만 전환)
        document.getElementById('category-filter').addEventListener('click', e => {
            const btn = e.target.closest('.filter-btn');
            if (!btn) return;
            document.querySelectorAll('#category-filter .filter-btn').forEach(b => b.classList.toggle('active', b === btn));
        });

    </script>

</th:block>

</html>
